name: bloggers
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  supabase_auth_ui: ^0.7.0
  flutter_supabase_chat_core: ^1.6.2
  fluttertoast: ^10.0.0
  modal_progress_hud_nsn: ^0.5.1
  image_picker: ^1.2.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - images/klm.png
    - images/notebook.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/klm.png"

flutter_native_splash:
  color: "#EB740C"
  image: "images/klm.png"
  android_12:
    image: "images/klm.png"
    color: "#EB740C"